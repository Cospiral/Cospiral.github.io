<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Il nostro album dei ricordi ciccina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose:      #e8759a;
      --rose-light:#f4a8c0;
      --rose-dark: #c05070;
      --gold:      #d4a857;
      --gold-light:#f0d080;
      --bg:        #0d0810;
      --bg2:       #160d1a;
      --glass:     rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.12);
      --text:      #f5eef8;
      --text-muted:#a08cb0;
      --radius:    18px;
      --shadow:    0 20px 60px rgba(0,0,0,0.6);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ─────────────────────────────────────────────
       STARFIELD BACKGROUND
    ───────────────────────────────────────────── */
    #stars-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ─────────────────────────────────────────────
       LAYOUT WRAPPER
    ───────────────────────────────────────────── */
    #app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 0 0 60px;
    }

    /* ─────────────────────────────────────────────
       HEADER
    ───────────────────────────────────────────── */
    header {
      text-align: center;
      padding: 52px 24px 36px;
      background: linear-gradient(180deg, rgba(232,117,154,0.18) 0%, transparent 100%);
      border-bottom: 1px solid var(--glass-border);
      backdrop-filter: blur(6px);
    }

    header .heart-icon {
      font-size: 2.4rem;
      display: inline-block;
      animation: heartbeat 1.6s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%       { transform: scale(1.18); }
      28%       { transform: scale(1); }
      42%       { transform: scale(1.12); }
      70%       { transform: scale(1); }
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.9rem, 5vw, 3.2rem);
      background: linear-gradient(135deg, var(--rose-light), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 10px 0 6px;
      line-height: 1.2;
    }

    header p.subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-style: italic;
      letter-spacing: 0.04em;
    }

    /* ─────────────────────────────────────────────
       GALLERY VIEW
    ───────────────────────────────────────────── */
    #gallery-view { display: block; }
    #detail-view  { display: none; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
      padding: 40px 32px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ─── PHOTO CARD ─── */
    .photo-card {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      background: var(--bg2);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow);
      transition: transform 0.35s cubic-bezier(.22,.68,0,1.2),
                  box-shadow 0.35s ease,
                  border-color 0.35s ease;
      animation: cardIn 0.5s ease both;
    }

    .photo-card:hover {
      transform: translateY(-8px) scale(1.025);
      box-shadow: 0 32px 80px rgba(232,117,154,0.25);
      border-color: var(--rose);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .photo-card:hover img {
      transform: scale(1.06);
    }

    /* placeholder when no image */
    .photo-card .placeholder-img {
      width: 100%;
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      background: linear-gradient(135deg, #1e0f2a, #2d1540);
      transition: transform 0.4s ease;
    }

    .photo-card:hover .placeholder-img {
      transform: scale(1.06);
    }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.75) 0%, transparent 55%);
      opacity: 0;
      transition: opacity 0.35s ease;
      display: flex;
      align-items: flex-end;
      padding: 20px;
    }

    .photo-card:hover .card-overlay {
      opacity: 1;
    }

    .card-overlay span {
      font-size: 0.82rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.04em;
    }

    .card-info {
      padding: 14px 16px 16px;
    }

    .card-info .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-info .card-date {
      font-size: 0.78rem;
      color: var(--rose-light);
      letter-spacing: 0.04em;
    }

    /* badge numero foto */
    .card-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(232,117,154,0.85);
      backdrop-filter: blur(4px);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    /* empty state */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
    }

    .empty-state .big-icon { font-size: 4rem; margin-bottom: 16px; display: block; }
    .empty-state h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin-bottom: 8px; color: var(--text); }
    .empty-state p  { font-size: 0.9rem; }

    /* ─────────────────────────────────────────────
       DETAIL VIEW
    ───────────────────────────────────────────── */
    .detail-wrapper {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px 24px;
      animation: fadeSlideIn 0.45s ease both;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* back button */
    #back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      padding: 10px 20px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s, transform 0.2s;
      backdrop-filter: blur(6px);
      margin-bottom: 28px;
    }

    #back-btn:hover {
      background: rgba(232,117,154,0.18);
      border-color: var(--rose);
      transform: translateX(-3px);
    }

    /* main image */
    .detail-image-wrap {
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--glass-border);
      margin-bottom: 28px;
      position: relative;
    }

    .detail-image-wrap img {
      width: 100%;
      max-height: 520px;
      object-fit: cover;
      display: block;
    }

    .detail-image-wrap .placeholder-detail {
      width: 100%;
      height: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      background: linear-gradient(135deg, #1e0f2a, #2d1540);
    }

    /* meta row */
    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.84rem;
      color: var(--rose-light);
      backdrop-filter: blur(4px);
    }

    .meta-pill .pill-icon { font-size: 1rem; }

    /* title & description */
    .detail-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      background: linear-gradient(135deg, var(--rose-light), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .detail-moment {
      font-size: 0.88rem;
      color: var(--gold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detail-description {
      font-size: 1rem;
      line-height: 1.8;
      color: rgba(245,238,248,0.85);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 24px 28px;
      backdrop-filter: blur(6px);
    }

    /* nav arrows */
    .detail-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 32px;
      gap: 12px;
    }

    .nav-arrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      padding: 12px 22px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s;
      backdrop-filter: blur(6px);
    }

    .nav-arrow:hover:not(:disabled) {
      background: rgba(232,117,154,0.2);
      border-color: var(--rose);
    }

    .nav-arrow:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .nav-counter {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* ─────────────────────────────────────────────
       SCROLLBAR
    ───────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--rose-dark); border-radius: 999px; }

    /* ─────────────────────────────────────────────
       FOOTER
    ───────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.78rem;
      color: var(--text-muted);
      border-top: 1px solid var(--glass-border);
    }

    footer span { color: var(--rose); }

    /* ─────────────────────────────────────────────
       RESPONSIVE
    ───────────────────────────────────────────── */
    @media (max-width: 520px) {
      .gallery-grid { padding: 24px 16px; gap: 16px; }
      .detail-wrapper { padding: 24px 16px; }
      .detail-description { padding: 18px; }
    }
  </style>
</head>
<body>

<canvas id="stars-canvas"></canvas>

<div id="app">

  <!-- ══════════════════════════════ HEADER ══════════════════════════════ -->
  <header>
    <div class="heart-icon">💖</div>
    <h1>Il Nostro Album</h1>
    <p class="subtitle">La raccolta dei momenti più belli della mia vita con te</p>
  </header>

  <!-- ══════════════════════════════ GALLERY VIEW ══════════════════════════════ -->
  <section id="gallery-view">
    <div class="gallery-grid" id="gallery-grid">
      <!-- Le card vengono generate da JavaScript -->
    </div>
  </section>

  <!-- ══════════════════════════════ DETAIL VIEW ══════════════════════════════ -->
  <section id="detail-view">
    <div class="detail-wrapper">

      <button id="back-btn" onclick="showGallery()">
        ← Torna all'album
      </button>

      <div class="detail-image-wrap" id="detail-image-wrap">
        <!-- immagine / placeholder -->
      </div>

      <div class="detail-meta">
        <div class="meta-pill"><span class="pill-icon">📅</span> <span id="detail-date">—</span></div>
        <div class="meta-pill"><span class="pill-icon">📍</span> <span id="detail-moment-pill">—</span></div>
      </div>

      <h2 class="detail-title" id="detail-title">—</h2>
      <div class="detail-moment" id="detail-moment-label">💛 —</div>

      <div class="detail-description" id="detail-description">—</div>

      <div class="detail-nav">
        <button class="nav-arrow" id="btn-prev" onclick="navigateDetail(-1)">← Precedente</button>
        <span class="nav-counter" id="nav-counter"></span>
        <button class="nav-arrow" id="btn-next" onclick="navigateDetail(1)">Successiva →</button>
      </div>

    </div>
  </section>

  <footer>
    per il compleanno dell'amore della mia vita <span>💕</span>
  </footer>

</div><!-- /app -->


<script>
/* ════════════════════════════════════════════════════════════════════════
   ██████  ALBUM DEI RICORDI — DATI FOTO
   ════════════════════════════════════════════════════════════════════════

   Per aggiungere una foto:
   1. Copia un blocco { ... } all'interno dell'array PHOTOS
   2. Compila i campi:
       - src:         percorso dell'immagine (es. "foto/mia_foto.jpg")
                      oppure URL completo (es. "https://...")
                      Lascia "" per mostrare l'emoji placeholder
       - emoji:       emoji di riserva se non c'è immagine
       - title:       titolo breve della foto
       - date:        data dello scatto (stringa libera, es. "14 Febbraio 2024")
       - moment:      a quale momento si riferisce (es. "Primo viaggio insieme")
       - description: testo lungo da mostrare nella pagina di dettaglio

   ════════════════════════════════════════════════════════════════════════ */

const PHOTOS = [
  {
    src:         "",
    emoji:       "🌹",
    title:       "Il primo sguardo",
    date:        "12 Marzo 2023",
    moment:      "Il giorno in cui ci siamo conosciuti",
    description: "Ricordi quel giorno? La luce filtrava in un modo strano e tu sorridi in quella foto come se il mondo fosse tuo. Da quel momento ho saputo che questa storia era qualcosa di speciale."
  },
  {
    src:         "",
    emoji:       "🌊",
    title:       "Al mare insieme",
    date:        "10 Luglio 2023",
    moment:      "Prima estate insieme",
    description: "Le onde, il sole, le risate. Questa foto porta con sé il profumo di salsedine e la leggerezza di quella prima estate passata insieme. Uno dei giorni più belli della mia vita."
  },
  {
    src:         "",
    emoji:       "🍕",
    title:       "Quella sera in pizzeria",
    date:        "3 Settembre 2023",
    moment:      "Una serata normale, resa speciale da te",
    description: "Non era un giorno speciale — era solo una serata in pizzeria. Eppure mi ricordo ogni momento: le tue risate, i tuoi occhi, il modo in cui hai rubato la mia ultima fetta. Ti amo anche per questo."
  },
  {
    src:         "",
    emoji:       "🎄",
    title:       "Il nostro Natale",
    date:        "25 Dicembre 2023",
    moment:      "Primo Natale insieme",
    description: "Luci, regali, cioccolata calda e tu seduta vicino a me. Il nostro primo Natale insieme è stato magico. Ogni ornamento sull'albero mi ricorderà sempre di questa sera."
  },
  {
    src:         "",
    emoji:       "✈️",
    title:       "Partenza verso l'avventura",
    date:        "15 Aprile 2024",
    moment:      "Il nostro primo viaggio",
    description: "Le valigie pronte, la trepidazione, il tuo entusiasmo contagioso. Viaggiare con te ha un sapore diverso: ogni posto diventa più bello quando sei lì accanto a me."
  },
  {
    src:         "",
    emoji:       "💫",
    title:       "Buon compleanno, amore",
    date:        "15 Maggio 2026",
    moment:      "Il tuo compleanno ❤️",
    description: "Questo album è il mio regalo per te. Ogni pagina è un ricordo che voglio custodire per sempre. Grazie per essere nella mia vita, per le risate, per i momenti difficili affrontati insieme, per tutto. Tanti auguri Fabiana 🎂💖"
  }
];

/* ════════════════════════════════════════════════════════════════════════
   LOGICA APP
   ════════════════════════════════════════════════════════════════════════ */

let currentIndex = 0;

/* ── Render gallery ── */
function renderGallery() {
  const grid = document.getElementById('gallery-grid');
  grid.innerHTML = '';

  if (PHOTOS.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <span class="big-icon">📷</span>
        <h3>L'album è ancora vuoto</h3>
        <p>Aggiungi le vostre foto nell'array PHOTOS nel codice HTML</p>
      </div>`;
    return;
  }

  PHOTOS.forEach((photo, index) => {
    const card = document.createElement('div');
    card.className = 'photo-card';
    card.style.animationDelay = `${index * 0.06}s`;
    card.onclick = () => showDetail(index);

    const imgHtml = photo.src
      ? `<img src="${photo.src}" alt="${photo.title}" loading="lazy" />`
      : `<div class="placeholder-img">${photo.emoji}</div>`;

    card.innerHTML = `
      ${imgHtml}
      <div class="card-overlay">
        <span>👁 Vedi ricordo</span>
      </div>
      <div class="card-badge">${index + 1}</div>
      <div class="card-info">
        <div class="card-title">${photo.title}</div>
        <div class="card-date">📅 ${photo.date}</div>
      </div>`;

    grid.appendChild(card);
  });
}

/* ── Show detail ── */
function showDetail(index) {
  currentIndex = index;
  populateDetail(index);
  document.getElementById('gallery-view').style.display = 'none';
  document.getElementById('detail-view').style.display  = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── Populate detail ── */
function populateDetail(index) {
  const photo = PHOTOS[index];

  // Image / placeholder
  const wrap = document.getElementById('detail-image-wrap');
  wrap.innerHTML = photo.src
    ? `<img src="${photo.src}" alt="${photo.title}" />`
    : `<div class="placeholder-detail">${photo.emoji}</div>`;

  document.getElementById('detail-title').textContent        = photo.title;
  document.getElementById('detail-date').textContent         = photo.date;
  document.getElementById('detail-moment-pill').textContent  = photo.moment;
  document.getElementById('detail-moment-label').innerHTML   = `💛 ${photo.moment}`;
  document.getElementById('detail-description').textContent  = photo.description;

  // Nav counter & buttons
  document.getElementById('nav-counter').textContent = `${index + 1} / ${PHOTOS.length}`;
  document.getElementById('btn-prev').disabled = index === 0;
  document.getElementById('btn-next').disabled = index === PHOTOS.length - 1;
}

/* ── Navigate detail ── */
function navigateDetail(direction) {
  const newIndex = currentIndex + direction;
  if (newIndex < 0 || newIndex >= PHOTOS.length) return;
  currentIndex = newIndex;
  populateDetail(currentIndex);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── Back to gallery ── */
function showGallery() {
  document.getElementById('detail-view').style.display  = 'none';
  document.getElementById('gallery-view').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ════════════════════════════════════════════════════════════════════════
   STARFIELD CANVAS
   ════════════════════════════════════════════════════════════════════════ */
(function initStars() {
  const canvas = document.getElementById('stars-canvas');
  const ctx    = canvas.getContext('2d');
  let stars    = [];
  const N      = 180;

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function createStars() {
    stars = [];
    for (let i = 0; i < N; i++) {
      stars.push({
        x:     Math.random() * canvas.width,
        y:     Math.random() * canvas.height,
        r:     Math.random() * 1.4 + 0.2,
        alpha: Math.random(),
        speed: Math.random() * 0.004 + 0.001,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  function draw(time) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.alpha = 0.3 + 0.7 * Math.abs(Math.sin(time * s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      const hue = Math.random() < 0.15 ? '340, 80%' : '220, 20%';
      ctx.fillStyle = `hsla(${hue}, 95%, ${s.alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  resize();
  createStars();
  window.addEventListener('resize', () => { resize(); createStars(); });
  requestAnimationFrame(draw);
})();

/* ── Init ── */
renderGallery();
</script>

</body>
</html>
